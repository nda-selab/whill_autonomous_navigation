# MPPI load comparison: 60 x 0.05 s = 3 s horizon (baseline: 8 s).
# All other settings match nav2_params.yaml at creation.
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_nav
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom_nav

    speed_limit_topic: /speed_limit
    publish_zero_velocity: true
    
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.02
    
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.10
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      time_steps: 60
      model_dt: 0.05
      batch_size: 500
      iteration_count: 1
      vx_max: 0.35
      vx_min: -0.15
      vy_max: 0.0
      wz_max: 0.5
      vx_std: 0.10
      vy_std: 0.20
      wz_std: 0.30
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.5
      transform_tolerance: 0.2
      reset_period: 1.0
      regenerate_noises: false
      visualize: false
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 2.0
      PathAlignCritic:
        enabled: false
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.8
        offset_from_furthest: 3
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 5
        threshold_to_consider: 2.0
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 3
        threshold_to_consider: 0.8
        max_angle_to_furthest: 1.0
        forward_preference: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 0.6
      footprint: "[[0.80, 0.275], [0.80, -0.275], [-0.25, -0.275], [-0.25, 0.275]]"

      plugins:
        - static_layer
        - ouster_layer
        - urg_front_layer
        - urg_left_layer
        - urg_right_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true

      ouster_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 2.0
        decay_model: 0
        voxel_size: 0.05
        mark_threshold: 0
        track_unknown_space: false
        update_footprint_enabled: true
        combination_method: 1
        transform_tolerance: 0.2
        mapping_mode: false
        publish_voxel_map: false
        observation_sources: ouster_marking
        ouster_marking:
          topic: /ouster/obstacles
          data_type: "PointCloud2"
          sensor_frame: os_lidar
          marking: true
          clearing: false
          obstacle_range: 8.0
          expected_update_rate: 0.5
          observation_persistence: 0.0
          clear_after_reading: true
          filter: "none"
      
      urg_front_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 2.0
        decay_model: 0
        voxel_size: 0.05
        mark_threshold: 0
        track_unknown_space: false
        update_footprint_enabled: true
        combination_method: 1
        transform_tolerance: 0.5
        mapping_mode: false
        publish_voxel_map: false
        observation_sources: urg_front_marking
        urg_front_marking:
          topic: /urg_front/obstacles
          data_type: "PointCloud2"
          sensor_frame: laser_front
          marking: true
          clearing: false
          obstacle_range: 1.0
          expected_update_rate: 0.1
          observation_persistence: 0.0
          clear_after_reading: true
          filter: "none"

      urg_left_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0
        observation_sources: urg_left_marking urg_left_clearing
        urg_left_marking:
          topic: /urg_left/obstacles
          data_type: "PointCloud2"
          sensor_frame: laser_left
          marking: true
          clearing: false
          expected_update_rate: 0.5
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
        urg_left_clearing:
          topic: /urg_left/clearing
          data_type: "PointCloud2"
          sensor_frame: laser_left
          marking: false
          clearing: true
          expected_update_rate: 0.5
          raytrace_min_range: 0.0
          raytrace_max_range: 1.6
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0

      urg_right_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0
        observation_sources: urg_right_marking urg_right_clearing
        urg_right_marking:
          topic: /urg_right/obstacles
          data_type: "PointCloud2"
          sensor_frame: laser_right
          marking: true
          clearing: false
          expected_update_rate: 0.5
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
        urg_right_clearing:
          topic: /urg_right/clearing
          data_type: "PointCloud2"
          sensor_frame: laser_right
          marking: false
          clearing: true
          expected_update_rate: 0.5
          raytrace_min_range: 0.0
          raytrace_max_range: 1.6
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      resolution: 0.10 # 0.05 / 0.10 / 0.12
      update_frequency: 0.5
      publish_frequency: 0.5
      transform_tolerance: 0.5
      footprint: "[[0.80, 0.275], [0.80, -0.275], [-0.25, -0.275], [-0.25, 0.275]]"

      plugins: ["static_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.00
        cost_scaling_factor: 3.0

      always_send_full_costmap: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      tolerance: 0.05
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      lattice_filepath: /home/selab/ros2_ws/src/whill_autonomous_navigation/whill_nav2_bringup/config/lattice/diff_10cm.json # 5cm / 10cm / 12cm

      allow_reverse_expansion: true
      cost_penalty: 2.0
      rotation_penalty: 5.0
      smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0

    #behavior_plugins: ["spin", "backup", "wait"]
    behavior_plugins: ["spin"]

    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.5

    spin:
      plugin: "nav2_behaviors/Spin"
    #backup:
    #  plugin: "nav2_behaviors/BackUp"
    #wait:
    #  plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: false
    loop_rate: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.5]
    min_velocity: [-0.15, 0.0, -0.5]
    max_accel: [0.3, 0.0, 0.5]
    max_decel: [-0.3, 0.0, -0.5]
    odom_topic: /odom_nav
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
