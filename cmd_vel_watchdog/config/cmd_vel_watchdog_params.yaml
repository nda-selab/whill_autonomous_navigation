cmd_vel_watchdog:
  ros__parameters:
    input_topic: /cmd_vel
    output_topic: /whill/controller/cmd_vel

    command_timeout_sec: 0.4
    localization_timeout_sec: 1.5
    publish_frequency: 20.0

    max_forward_speed: 0.25
    max_reverse_speed: 0.15
    max_angular_speed: 0.5

    route_speed_limit: 0.25
    route_hold: false