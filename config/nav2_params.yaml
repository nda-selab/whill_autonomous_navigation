map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_nav
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odom_nav
    
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.02
    
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.30
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      max_vel_x: 0.25
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5

      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0

      acc_lim_x: 0.3
      decel_lim_x: -0.3
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_theta: -0.5

      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2

      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.6
      footprint: "[[0.80, 0.275], [0.80, -0.275], [-0.25, -0.275], [-0.25, 0.275]]"

      plugins: ["obstacle_layer", "urg_ground_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        footprint_clearing_enabled: true
        enabled: true
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        observation_sources: ouster_scan urg_front
        ouster_scan:
          topic: /scan_ouster
          data_type: "LaserScan"
          sensor_frame: os_sensor
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.5
          obstacle_min_range: 0.1
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 10.0
          max_obstacle_height: 2.0
          min_obstacle_height: -2.0
        urg_front:
          topic: /urg_front/scan
          data_type: "LaserScan"
          sensor_frame: laser_front
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.5
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0

      urg_ground_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        footprint_clearing_enabled: true
        enabled: true
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0
        observation_sources: urg_left urg_left_clear urg_right urg_right_clear
        urg_left:
          topic: /urg_left/obstacles
          data_type: "PointCloud2"
          sensor_frame: laser_left
          marking: true
          clearing: false
          expected_update_rate: 0.5
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
        urg_left_clear:
          topic: /urg_left/clearing
          data_type: "PointCloud2"
          sensor_frame: laser_left
          marking: false
          clearing: true
          expected_update_rate: 0.5
          raytrace_min_range: 0.0
          raytrace_max_range: 1.6
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
        urg_right:
          topic: /urg_right/obstacles
          data_type: "PointCloud2"
          sensor_frame: laser_right
          marking: true
          clearing: false
          expected_update_rate: 0.5
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
        urg_right_clear:
          topic: /urg_right/clearing
          data_type: "PointCloud2"
          sensor_frame: laser_right
          marking: false
          clearing: true
          expected_update_rate: 0.5
          raytrace_min_range: 0.0
          raytrace_max_range: 1.6
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.80
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      footprint: "[[0.80, 0.275], [0.80, -0.275], [-0.25, -0.275], [-0.25, 0.275]]"

      plugins: ["static_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.80
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      #lattice_filepath: /home/selab/ros2_ws/src/whill_nav2_bringup/config/lattice/diff_5cm.json
      lattice_filepath: /home/selab/ros2_ws/src/whill_nav2_bringup/config/lattice/diff_10cm.json
      #lattice_filepath: /home/selab/ros2_ws/src/whill_nav2_bringup/config/lattice/diff_12cm.json

      allow_reverse_expansion: false
      cost_penalty: 2.0
      rotation_penalty: 5.0
      smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0

    behavior_plugins: ["spin", "backup", "wait"]

    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.5

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: false
    loop_rate: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.5]
    min_velocity: [-0.15, 0.0, -0.5]
    max_accel: [0.3, 0.0, 0.5]
    max_decel: [-0.3, 0.0, -0.5]
    odom_topic: /odom_nav
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
