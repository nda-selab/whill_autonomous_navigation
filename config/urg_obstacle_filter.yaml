urg_obstacle_filter:
  ros__parameters:
    # 左右URGの縦走査点をbase_linkへ変換して、近傍床面 z=a*x+b を推定
    floor_fit_x_min: -0.05
    floor_fit_x_max: 0.45
    floor_fit_z_abs_max: 0.18
    floor_inlier_tolerance: 0.025
    floor_min_inliers: 8
    floor_min_span: 0.15
    floor_anchor_x_max: 0.20
    floor_anchor_min_inliers: 4
    floor_max_slope: 0.25
    floor_max_intercept_abs: 0.12

    # 床面からの高さで突出物を分類。負の段差は未実装
    obstacle_x_min: -0.05
    obstacle_x_max: 1.50
    obstacle_min_height: 0.05
    obstacle_max_height: 0.40
    min_cluster_points: 2

    sensor_timeout_sec: 0.6
    tf_timeout_sec: 0.2
    max_scan_range: 4.0
